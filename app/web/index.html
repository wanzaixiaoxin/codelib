<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码知识工作台 · codelib</title>
<style>
  :root{
    --bg:#f5f7fa; --panel:#fff; --sidebar:#fafbfc; --line:#e4e7eb; --text:#1f2328;
    --muted:#8a9099; --brand:#3b6ef6; --brand-soft:#eaf0ff; --ok:#1a9f5f; --warn:#c77700;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--text);font-size:14px}
  .app{display:flex;height:100vh;overflow:hidden}
  /* ---------- sidebar ---------- */
  .sidebar{width:300px;flex:0 0 300px;background:var(--sidebar);border-right:1px solid var(--line);
           display:flex;flex-direction:column;min-height:0}
  .brand{padding:16px 16px 10px;font-weight:700;font-size:16px}
  .brand .sub{font-weight:400;font-size:12px;color:var(--muted);margin-left:6px}
  .ro{padding:7px 16px;font-size:12px;color:#1a7f4b;background:#eaf7ef;border-top:1px solid #d6ecdf;
      border-bottom:1px solid #d6ecdf;display:flex;align-items:center;gap:6px}
  .sec{padding:12px 14px 6px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .libraries{padding:0 10px 8px;max-height:38vh;overflow-y:auto}
  .lib{padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
  .lib:hover{background:#f0f2f5}
  .lib.active{background:var(--brand-soft);border-color:#d4e0ff}
  .lib-name{font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:6px}
  .lib-meta{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:1px}
  .dot.ready{background:var(--ok)} .dot.empty{background:#c7ccd3}
  .newline{padding:0 14px 10px;display:flex;flex-direction:column;gap:8px}
  .newline button{height:36px;border-radius:9px;border:1px solid var(--brand);background:var(--brand);
       color:#fff;font-weight:600;cursor:pointer;font-size:13px}
  .newline button:disabled{opacity:.5;cursor:not-allowed}
  .conv-list{flex:1;overflow-y:auto;padding:0 10px;min-height:0}
  .conv{padding:9px 10px;border-radius:9px;cursor:pointer;border:1px solid transparent}
  .conv:hover{background:#f0f2f5}
  .conv.active{background:var(--brand-soft);border-color:#d4e0ff}
  .conv.empty-conv .conv-title{color:var(--muted);font-style:italic}
  .conv.empty-conv .conv-title::after{content:" · 空";font-size:11px;color:#9aa1aa;font-style:normal}
  .conv-title{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv-sub{display:flex;gap:6px;margin-top:3px;color:var(--muted);font-size:11px}
  .badge{background:#eef0f3;border-radius:6px;padding:1px 6px;color:#5b6472;max-width:120px;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap}
  .hint{color:var(--muted);font-size:12px;padding:8px 14px}
  /* ---------- main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:60px;flex:0 0 60px;background:var(--panel);border-bottom:1px solid var(--line);
          display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .title{font-weight:600;font-size:15px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta{font-size:12px;color:var(--muted);margin-top:3px}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:8px;height:32px;padding:0 12px;
         color:#5b6472;cursor:pointer;font-size:12px}
  .ghost:hover{color:#c0392b;border-color:#f0c4bd}
  .messages{flex:1;overflow-y:auto;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
  .empty{margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:10px}
  .empty-icon{font-size:38px;opacity:.6}
  .msg{display:flex;gap:10px;max-width:84%}
  .msg.user{align-self:flex-end;flex-direction:row-reverse}
  .avatar{width:28px;height:28px;border-radius:50%;flex:0 0 28px;display:flex;align-items:center;
          justify-content:center;font-size:12px;font-weight:600}
  .msg.user .avatar{background:var(--brand);color:#fff}
  .msg.assistant .avatar{background:#e9edf5;color:var(--brand)}
  .bubble{padding:11px 14px;border-radius:12px;line-height:1.7;white-space:normal;word-break:break-word}
  .msg.user .bubble{white-space:pre-wrap}
  .bubble p{margin:0 0 10px}.bubble p:last-child{margin-bottom:0}
  .bubble h1,.bubble h2,.bubble h3,.bubble h4{line-height:1.4;margin:14px 0 7px}
  .bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child,.bubble h4:first-child{margin-top:0}
  .bubble ul,.bubble ol{margin:4px 0 10px;padding-left:24px}
  .bubble li{padding-left:2px;margin:3px 0}
  .bubble blockquote{margin:8px 0;padding:2px 0 2px 12px;border-left:3px solid #d5dbe5;color:#5b6472}
  .bubble code{font-family:Consolas,"SFMono-Regular",monospace;font-size:.92em;background:#f1f3f6;border-radius:4px;padding:1px 4px}
  .bubble pre{overflow:auto;padding:10px 12px;background:#f6f7f9;border:1px solid var(--line);border-radius:8px;white-space:pre-wrap}
  .bubble pre code{padding:0;background:transparent}
  .bubble table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse;margin:8px 0 12px}
  .bubble th,.bubble td{border:1px solid var(--line);padding:5px 9px;text-align:left;white-space:normal}
  .bubble th{background:#f6f7f9}
  .bubble a{color:var(--brand);text-decoration:underline}
  .bubble hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .msg.user .bubble{background:var(--brand);color:#fff;border-bottom-right-radius:4px}
  .msg.assistant .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .time{font-size:11px;color:var(--muted);align-self:flex-end;margin-bottom:2px}
  .typing{color:var(--muted)}
  .sources{font-size:11.5px;color:var(--muted);align-self:flex-start;padding-left:38px;max-width:84%}
  .composer{flex:0 0 auto;background:var(--panel);border-top:1px solid var(--line);padding:12px 16px;
            display:flex;gap:10px;align-items:flex-end}
  #input{flex:1;resize:none;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;
         line-height:1.5;max-height:160px;outline:none;font-family:inherit}
  #input:focus{border-color:#b9ccff;box-shadow:0 0 0 3px rgba(59,110,246,.08)}
  #sendBtn{height:42px;padding:0 20px;border:none;border-radius:10px;background:var(--brand);color:#fff;
           font-weight:600;cursor:pointer}
  #sendBtn:disabled{opacity:.5;cursor:default}
  .topright{display:flex;gap:8px;align-items:center}
  /* ---------- 溯源评估面板 ---------- */
  .drawer{position:fixed;top:0;right:0;width:min(760px,96vw);height:100vh;background:#fff;
          border-left:1px solid var(--line);box-shadow:-8px 0 28px rgba(0,0,0,.12);
          transform:translateX(100%);transition:.22s;display:flex;flex-direction:column;z-index:20}
  .drawer.open{transform:none}
  .drawer-hd{height:54px;flex:0 0 54px;display:flex;align-items:center;justify-content:space-between;
             padding:0 14px;border-bottom:1px solid var(--line);font-weight:600}
  .drawer-body{flex:1;overflow-y:auto;padding:14px;font-size:13px}
  .kv{margin-bottom:10px}
  .kv h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600}
  .kv pre{background:#f7f8fa;border:1px solid var(--line);border-radius:8px;padding:8px;
          white-space:pre-wrap;word-break:break-word;max-height:240px;overflow:auto;margin:0;font-size:12px}
  .tag{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11px;margin-right:6px}
  .tag.ok{background:#eaf7ef;color:#1a7f4b}
  .tag.bad{background:#fdecea;color:#c0392b}
  .tag.good{background:#eaf7ef;color:#1a7f4b}
  .tag.fair{background:#fff6e5;color:#9a6700}
  .tag.poor{background:#fdecea;color:#c0392b}
  .evt{border-left:2px solid #e4e7eb;padding:2px 0 8px 10px;margin-left:4px}
  .evt .st{font-weight:600;font-size:12px}
  .evt .tm{color:var(--muted);font-size:11px;margin-left:6px}
  .impr{margin:4px 0 0 16px;padding:0}
  .impr li{margin-bottom:4px}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  .login-card{width:min(390px,92vw);padding:28px;background:#fff;border:1px solid var(--line);border-radius:14px;
              box-shadow:0 10px 35px rgba(20,35,60,.08)}
  .login-card h1{font-size:20px;margin:0 0 8px}.login-card p{color:var(--muted);font-size:13px;margin:0 0 18px}
  .admin-modal{position:fixed;inset:0;background:rgba(25,35,55,.35);display:none;align-items:center;justify-content:center;z-index:30}
  .admin-modal.open{display:flex}.admin-card{background:#fff;width:min(900px,96vw);max-height:92vh;overflow:auto;border-radius:12px;padding:18px}
  .admin-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:10px}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:12px}
  .admin-section{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
  .admin-section h3{font-size:14px;margin:0 0 12px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}
  .field input,.field select{height:36px;border:1px solid var(--line);border-radius:7px;padding:0 9px;font:inherit}
  .primary{background:var(--brand);color:#fff;border:0;border-radius:7px;padding:9px 14px;cursor:pointer}
  .user-row{display:grid;grid-template-columns:1fr 2fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .user-row select{min-height:54px;border:1px solid var(--line);border-radius:7px;padding:5px}
  .muted{color:var(--muted);font-size:12px}
  @media(max-width:700px){.admin-grid{grid-template-columns:1fr}.user-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<section id="loginScreen" class="login-screen" style="display:none">
  <form id="loginForm" class="login-card">
    <h1>代码知识工作台</h1><p>使用管理员或普通账号登录</p>
    <div class="field"><label for="loginUser">用户名</label><input id="loginUser" autocomplete="username" required></div>
    <div class="field"><label for="loginPassword">密码</label><input id="loginPassword" type="password" autocomplete="current-password" required></div>
    <button class="primary" style="width:100%;margin-top:8px">登录</button>
    <div id="loginError" class="muted" style="margin-top:10px;color:#c0392b"></div>
  </form>
</section>
<div class="app" id="appRoot" style="display:none">
  <aside class="sidebar">
    <div class="brand">代码知识工作台<span class="sub">codelib</span></div>
    <div class="ro">🔒 只读模式：仅可查询库，不会修改所关联工程的文件</div>

    <div class="sec"><span>知识库（选择后提问）</span><span id="libReload" style="cursor:pointer;color:var(--brand)">刷新</span></div>
    <div id="libraries" class="libraries"></div>

    <div class="newline"><button id="newBtn">＋ 新建对话（当前库）</button></div>

    <div class="sec"><span>历史对话</span></div>
    <div id="convList" class="conv-list"></div>
    <div class="hint" id="footHint"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div id="convTitle" class="title">新对话</div>
        <div id="convMeta" class="meta">先在左侧选择一个知识库</div>
      </div>
      <div class="topright">
        <span id="userBadge" class="badge"></span>
        <button id="adminBtn" class="ghost" style="display:none">账号/知识库管理</button>
        <button id="logoutBtn" class="ghost">退出</button>
        <button id="traceBtn" class="ghost">溯源/评估</button>
        <button id="delBtn" class="ghost">删除对话</button>
      </div>
    </header>
    <section id="messages" class="messages"></section>
    <footer class="composer">
      <textarea id="input" rows="1" placeholder="就当前知识库提问…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="sendBtn">发送</button>
    </footer>
  </main>
</div>

<!-- 溯源/评估抽屉 -->
<aside id="drawer" class="drawer">
  <div class="drawer-hd"><span>全链路溯源 &amp; 过程评估</span>
    <span><button id="evalBtn" class="ghost" style="margin-right:8px">评估当前</button>
    <button id="drawerClose" class="ghost">关闭</button></span></div>
  <div id="drawerBody" class="drawer-body"><div class="hint">先提问，再点「溯源/评估」查看该次调用的完整过程。</div></div>
</aside>
<aside id="adminPanel" class="admin-modal">
  <div class="admin-card">
    <div class="admin-head"><strong>管理员：账号与知识库</strong><button id="adminClose" class="ghost">关闭</button></div>
    <div class="admin-grid">
      <form id="createWorkspaceForm" class="admin-section">
        <h3>创建知识库</h3>
        <div class="field"><label>知识库名称</label><input name="name" required></div>
        <div class="field"><label>知识库 ID（可留空自动生成）</label><input name="id"></div>
        <div class="field"><label>本机工程目录</label><input name="path" placeholder="D:/projects/my-service" required></div>
        <div class="field"><label>说明</label><input name="description"></div>
        <button class="primary">创建并建库</button>
        <div class="muted" style="margin-top:8px">普通账号需单独获授权后才能查询。</div>
      </form>
      <form id="createUserForm" class="admin-section">
        <h3>创建账号</h3>
        <div class="field"><label>用户名</label><input name="username" minlength="2" required></div>
        <div class="field"><label>初始密码（至少 8 位）</label><input name="password" type="password" minlength="8" required></div>
        <div class="field"><label>角色</label><select name="role"><option value="user">普通账号</option><option value="admin">管理员</option></select></div>
        <div class="field"><label>允许访问的知识库（管理员自动可访问全部）</label><select name="workspace_ids" id="newUserWorkspaces" multiple size="4"></select></div>
        <button class="primary">创建账号</button>
      </form>
    </div>
    <section class="admin-section"><h3>账号与知识库授权</h3><div id="adminUsers" class="muted">加载中…</div></section>
  </div>
</aside>
<script src="/static/markdown-it.min.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const state = { convId:null, libId:null, libraries:[], conversations:[], sending:false, lastTraceId:null, user:null, allLibraries:[] };
const markdown = window.markdownit({html:false, linkify:true, typographer:false});
markdown.disable("image");

async function api(path, opts={}){
  const res = await fetch(path, Object.assign({headers:{"Content-Type":"application/json"}}, opts));
  if(!res.ok){
    let msg = "HTTP " + res.status;
    try{ const j = await res.json(); msg = j.detail || JSON.stringify(j);}catch(e){}
    const err=new Error(msg); err.status=res.status; throw err;
  }
  return res.json();
}
const fmtTime = (ts)=>{ if(!ts) return ""; const d=new Date(ts*1000), n=new Date();
  const hm=`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
  return d.toDateString()===n.toDateString()?hm:`${d.getMonth()+1}/${d.getDate()} ${hm}`; };
const libName = (id)=>{ const l=state.libraries.find(x=>x.id===id); return l?l.name:id; };

function renderLibraries(){
  const box=$("#libraries"); box.innerHTML="";
  if(!state.libraries.length){ box.innerHTML='<div class="hint">还没有配置知识库</div>'; return; }
  state.libraries.forEach(l=>{
    const el=document.createElement("div");
    el.className="lib"+(l.id===state.libId?" active":"");
    const ready=l.ready;
    el.innerHTML=`<div class="lib-name"><span><span class="dot ${ready?'ready':'empty'}"></span>${esc(l.name||l.id)}</span>
      <span style="font-weight:400;color:var(--muted);font-size:11px">${ready?'可查询':'未建库'}</span></div>
      <div class="lib-meta">${esc(l.desc||'')} ${ready?('· '+l.counts.chunks+' 块 / '+l.counts.symbols+' 符号'):''}</div>`;
    el.onclick=async ()=>{ await openEmptyOrNew(l.id); };
    box.appendChild(el);
  });
}

function renderConvList(){
  const box=$("#convList"); box.innerHTML="";
  const list = state.conversations;
  if(!list.length){ box.innerHTML='<div class="hint">暂无历史对话</div>'; refreshNewBtn(); return; }
  list.forEach(c=>{
    const el=document.createElement("div");
    el.className="conv"+(c.id===state.convId?" active":"")+(c.empty?" empty-conv":"");
    el.innerHTML=`<div class="conv-title"></div><div class="conv-sub"><span class="badge"></span><span class="time"></span></div>`;
    el.querySelector(".conv-title").textContent=c.title||"新对话";
    el.querySelector(".badge").textContent=libName(c.workspace_id);
    el.querySelector(".time").textContent=fmtTime(c.updated_at);
    el.onclick=()=>openConversation(c.id);
    box.appendChild(el);
  });
  refreshNewBtn();
}

function hasEmptyConv(){
  return state.conversations.some(c=>c.empty && c.workspace_id===state.libId);
}
function refreshNewBtn(){
  const btn=$("#newBtn");
  if(!btn) return;
  const disabled = hasEmptyConv();
  btn.disabled = disabled;
  btn.textContent = disabled ? "已有空的新对话" : "＋ 新建对话（当前库）";
  btn.title = disabled ? "每个库只保留一个空的新对话，请先在该对话里提问" : "";
}

function emptyHtml(){ return `<div class="empty"><div class="empty-icon">💬</div>
  <div>选择左侧知识库，新建或打开对话开始提问</div>
  <div style="font-size:12px">示例：这个工程是做什么的？／上行消息怎么处理？／有哪些 Kafka topic？</div></div>`; }

function renderMarkdown(text){ return markdown.render(String(text||"")); }

function addBubble(role,text,ts){
  const box=$("#messages"); const e=box.querySelector(".empty"); if(e) e.remove();
  const wrap=document.createElement("div"); wrap.className="msg "+(role==="user"?"user":"assistant");
  const av=document.createElement("div"); av.className="avatar"; av.textContent=role==="user"?"我":"AI";
  const bub=document.createElement("div"); bub.className="bubble";
  if(role==="user") bub.textContent=text; else bub.innerHTML=renderMarkdown(text);
  const tm=document.createElement("div"); tm.className="time"; tm.textContent=fmtTime(ts||Date.now()/1000);
  wrap.appendChild(av); wrap.appendChild(bub); wrap.appendChild(tm);
  box.appendChild(wrap); box.scrollTop=box.scrollHeight; return wrap;
}
function renderMessages(msgs){
  const box=$("#messages"); box.innerHTML="";
  if(!msgs||!msgs.length){ box.innerHTML=emptyHtml(); return; }
  msgs.forEach(m=>addBubble(m.role,m.content,m.created_at));
  box.scrollTop=box.scrollHeight;
}
function appendSources(src){
  if(!src||!src.length) return;
  const box=$("#messages"); const d=document.createElement("div"); d.className="sources";
  d.textContent="来源："+src.join("；"); box.appendChild(d); box.scrollTop=box.scrollHeight;
}

async function loadLibraries(){
  const d=await api("/api/workspaces");
  state.libraries=d.workspaces||[];
  if(!state.libraries.some(l=>l.id===state.libId)) state.libId=state.libraries.length?state.libraries[0].id:null;
  renderLibraries();
}
async function loadConversations(){
  const d=await api("/api/conversations");
  state.conversations=d.conversations||[];
  renderConvList();
}
async function openConversation(id){
  const d=await api("/api/conversations/"+id);
  state.convId=id; localStorage.setItem("codelib_conv",id);
  $("#convTitle").textContent=d.conversation.title||"新对话";
  $("#convMeta").textContent="知识库："+(d.workspace?d.workspace.name:d.conversation.workspace_id);
  state.libId=d.conversation.workspace_id; renderLibraries();
  renderMessages(d.messages); renderConvList();
}
function resetHeader(){ $("#convTitle").textContent="新对话"; $("#convMeta").textContent="先在左侧选择一个知识库"; }
async function openEmptyOrNew(libId){
  // 切到某库时：优先打开该库已有的空对话，没有才新建（保证每库最多一个空对话）
  state.libId = libId; renderLibraries();
  await loadConversations();
  const empty = state.conversations.find(c=>c.workspace_id===libId && c.empty);
  if(empty){ await openConversation(empty.id); return empty.id; }
  return await newConversation();
}

async function newConversation(){
  if(!state.libId){ alert("请先选择知识库"); return null; }
  if(hasEmptyConv()){
    // 已存在空对话：直接定位过去，不再新建
    const empty = state.conversations.find(c=>c.workspace_id===state.libId && c.empty);
    if(empty){ await openConversation(empty.id); $("#input").focus(); return empty.id; }
  }
  const d=await api("/api/conversations",{method:"POST",body:JSON.stringify({workspace:state.libId})});
  state.convId=d.conversation.id; localStorage.setItem("codelib_conv",state.convId);
  $("#convTitle").textContent=d.conversation.title||"新对话";
  $("#convMeta").textContent="知识库："+(d.workspace?d.workspace.name:"");
  renderMessages([]); await loadConversations(); $("#input").focus();
  return state.convId;
}
async function send(){
  const input=$("#input"); const text=input.value.trim();
  if(!text||state.sending) return;
  if(!state.convId){ const id=await newConversation(); if(!id) return; }
  state.sending=true; $("#sendBtn").disabled=true; input.value=""; autoGrow();
  addBubble("user",text,Date.now()/1000);
  const typing=addBubble("assistant","思考中…",Date.now()/1000);
  typing.querySelector(".bubble").classList.add("typing");
  try{
    const d=await api(`/api/conversations/${state.convId}/messages`,{method:"POST",body:JSON.stringify({content:text})});
    renderMessages(d.messages); appendSources(d.sources);
    if(d.trace_id) state.lastTraceId=d.trace_id;
    if(d.conversation&&d.conversation.title) $("#convTitle").textContent=d.conversation.title;
    await loadConversations();
  }catch(e){ typing.remove(); addBubble("assistant","出错："+e.message,Date.now()/1000); }
  finally{ state.sending=false; $("#sendBtn").disabled=false; input.focus(); }
}
function autoGrow(){ const t=$("#input"); t.style.height="auto";
  t.style.height=Math.min(t.scrollHeight,160)+"px"; }

async function loadWorkspace(){
  await loadLibraries(); await loadConversations();
  const saved=localStorage.getItem("codelib_conv");
  if(saved && state.conversations.some(c=>c.id===saved)) await openConversation(saved);
  else if(state.conversations.length) await openConversation(state.conversations[0].id);
  else { state.convId=null; renderMessages([]); resetHeader(); }
  $("#footHint").textContent = state.libraries.filter(l=>l.ready).length
    ? `账号 ${state.user.username} · ${state.libraries.length} 个授权库，${state.libraries.filter(l=>l.ready).length} 个可查询`
    : "当前没有可查询的知识库，请联系管理员授权";
}
async function init(){
  try{
    const me=await api("/api/auth/me"); state.user=me.user;
    $("#loginScreen").style.display="none"; $("#appRoot").style.display="flex";
    $("#userBadge").textContent=`${state.user.username} · ${state.user.role==='admin'?'管理员':'普通账号'}`;
    $("#adminBtn").style.display=state.user.role==='admin'?"inline-block":"none";
    $("#traceBtn").style.display=state.user.role==='admin'?"inline-block":"none";
    await loadWorkspace();
  }catch(e){
    if(e.status===401){ $("#appRoot").style.display="none"; $("#loginScreen").style.display="flex"; return; }
    $("#messages").innerHTML=`<div class="empty">初始化失败：${esc(e.message)}</div>`;
  }
}

function selectedValues(select){ return Array.from(select.selectedOptions).map(o=>o.value); }
async function openAdminPanel(){
  $("#adminPanel").classList.add("open");
  const [ud,wd]=await Promise.all([api("/api/admin/users"),api("/api/admin/workspaces")]);
  state.allLibraries=wd.workspaces||[];
  const opts=state.allLibraries.map(w=>`<option value="${esc(w.id)}">${esc(w.name)} (${esc(w.id)})</option>`).join("");
  $("#newUserWorkspaces").innerHTML=opts;
  const box=$("#adminUsers"); box.innerHTML="";
  (ud.users||[]).forEach(u=>{
    const row=document.createElement("div"); row.className="user-row";
    const selected=new Set(u.workspace_ids||[]);
    row.innerHTML=`<div><b>${esc(u.username)}</b><div class="muted">${u.role==='admin'?'管理员':'普通账号'} · ${u.active?'启用':'停用'}</div></div>
      <select multiple data-user-workspaces="${u.id}" ${u.role==='admin'?'disabled':''}>${state.allLibraries.map(w=>`<option value="${esc(w.id)}" ${selected.has(w.id)?'selected':''}>${esc(w.name)} (${esc(w.id)})</option>`).join("")}</select>
      <div><button class="ghost save-access" data-user="${u.id}" ${u.role==='admin'?'disabled':''}>保存授权</button>
      <button class="ghost reset-password" data-user="${u.id}">重置密码</button>
      <button class="ghost toggle-user" data-user="${u.id}" data-active="${u.active}">${u.active?'停用':'启用'}</button></div>`;
    box.appendChild(row);
  });
  box.querySelectorAll(".save-access").forEach(btn=>btn.onclick=async()=>{
    const uid=btn.dataset.user, sel=box.querySelector(`[data-user-workspaces="${uid}"]`);
    try{ await api(`/api/admin/users/${uid}/workspaces`,{method:"PUT",body:JSON.stringify({workspace_ids:selectedValues(sel)})}); alert("授权已更新"); }
    catch(e){ alert(e.message); }
  });
  box.querySelectorAll(".toggle-user").forEach(btn=>btn.onclick=async()=>{
    try{ await api(`/api/admin/users/${btn.dataset.user}/active`,{method:"PATCH",body:JSON.stringify({active:btn.dataset.active!=='true'})}); await openAdminPanel(); }
    catch(e){ alert(e.message); }
  });
  box.querySelectorAll(".reset-password").forEach(btn=>btn.onclick=async()=>{
    const password=prompt("输入至少 8 位的新密码：");
    if(password===null) return;
    try{
      await api(`/api/admin/users/${btn.dataset.user}/password`,{method:"PUT",body:JSON.stringify({password})});
      alert("密码已重置，该账号的现有登录会话已注销。");
      if(Number(btn.dataset.user)===state.user.id){
        await api("/api/auth/logout",{method:"POST"}); state.user=null; state.convId=null;
        $("#appRoot").style.display="none"; $("#loginScreen").style.display="flex";
      }
    }catch(e){ alert(e.message); }
  });
}

$("#loginForm").onsubmit=async(e)=>{
  e.preventDefault(); $("#loginError").textContent="";
  try{ await api("/api/auth/login",{method:"POST",body:JSON.stringify({username:$("#loginUser").value,password:$("#loginPassword").value})}); await init(); }
  catch(err){ $("#loginError").textContent=err.message; }
};
$("#logoutBtn").onclick=async()=>{ try{await api("/api/auth/logout",{method:"POST"});}finally{state.user=null;state.convId=null;$("#appRoot").style.display="none";$("#loginScreen").style.display="flex";} };
$("#adminBtn").onclick=()=>openAdminPanel().catch(e=>alert(e.message));
$("#adminClose").onclick=()=>$("#adminPanel").classList.remove("open");
$("#adminPanel").onclick=e=>{if(e.target===$("#adminPanel")) $("#adminPanel").classList.remove("open");};
$("#createWorkspaceForm").onsubmit=async(e)=>{
  e.preventDefault(); const f=new FormData(e.target); const btn=e.target.querySelector("button"); btn.disabled=true;
  try{ const r=await api("/api/admin/workspaces",{method:"POST",body:JSON.stringify({name:f.get("name"),id:f.get("id"),path:f.get("path"),description:f.get("description")})});
    alert(`知识库 ${r.workspace.name} 已创建并建库`); e.target.reset(); await loadWorkspace(); await openAdminPanel(); }
  catch(err){alert(err.message);}finally{btn.disabled=false;}
};
$("#createUserForm").onsubmit=async(e)=>{
  e.preventDefault(); const f=new FormData(e.target); const role=f.get("role");
  try{ await api("/api/admin/users",{method:"POST",body:JSON.stringify({username:f.get("username"),password:f.get("password"),role,
      workspace_ids:role==='user'?selectedValues($("#newUserWorkspaces")):[]})});
    alert("账号已创建"); e.target.reset(); await openAdminPanel(); }
  catch(err){alert(err.message);}
};

$("#newBtn").onclick=async ()=>{ try{ await newConversation(); }catch(e){ alert(e.message);} };
$("#libReload").onclick=async ()=>{ try{ await loadLibraries(); }catch(e){ alert(e.message);} };
$("#sendBtn").onclick=send;
$("#delBtn").onclick=async ()=>{
  if(!state.convId) return; if(!confirm("删除当前对话？")) return;
  try{ await api("/api/conversations/"+state.convId,{method:"DELETE"});
    state.convId=null; localStorage.removeItem("codelib_conv");
    renderMessages([]); resetHeader(); await loadConversations();
    if(state.conversations.length) await openConversation(state.conversations[0].id);
  }catch(e){ alert(e.message); }
};
$("#input").addEventListener("input",autoGrow);
$("#input").addEventListener("keydown",(e)=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); }});

/* ---------- 溯源/评估 ---------- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m])); }
async function openDrawer(){
  $("#drawer").classList.add("open");
  const body=$("#drawerBody"); body.innerHTML='<div class="hint">加载中…</div>';
  try{
    const d=await api("/api/traces?limit=30");
    const list=d.traces||[];
    if(!list.length){ body.innerHTML='<div class="hint">还没有任何问答记录</div>'; return; }
    body.innerHTML='<div class="kv"><h4>最近调用（点一条查看）</h4><div id="trlist"></div></div>';
    const box=body.querySelector("#trlist");
    list.forEach(t=>{
      const el=document.createElement("div");
      el.className="conv"; el.style.margin="4px 0";
      const v=t.verdict?`<span class="tag ${t.verdict}">${t.verdict} ${t.score!=null?Math.round(t.score):''}</span>`:`<span class="tag">未评估</span>`;
      el.innerHTML=`<div class="conv-title">${esc(t.question).slice(0,60)}</div>
        <div class="conv-sub">${v}<span class="badge">${esc(t.workspace_id)}</span><span class="time">${fmtTime(t.created_at)}</span></div>`;
      el.onclick=()=>showTrace(t.trace_id);
      box.appendChild(el);
    });
    if(state.lastTraceId) showTrace(state.lastTraceId);
  }catch(e){ body.innerHTML='<div class="hint">加载失败：'+esc(e.message)+'</div>'; }
}
async function showTrace(tid){
  const body=$("#drawerBody");
  const t=await api("/api/traces/"+tid);
  const ev={}; (t.events||[]).forEach(e=>{ if(!(e.stage in ev)) ev[e.stage]=e.data; });
  window._curTrace=tid;
  const last=ev.answer||{}; const llm=ev.llm||{};
  let h=`<div class="kv"><h4>问题</h4><pre>${esc(t.question)}</pre></div>`;
  if(ev.intent) h+=`<div class="kv"><h4>多轮理解/改写</h4><pre>${esc(ev.intent.effective_question||'')}\n(方式: ${esc(ev.intent.resolved_by||'-')}, 历史 ${esc(ev.intent.history_turns)} 轮)</pre></div>`;
  if(ev.retrieve){
    const cs=(ev.retrieve.citations||[]).map(c=>`- ${c.path}:${c.start_line}-${c.end_line} (${c.symbol||''})`).join("\n");
    h+=`<div class="kv"><h4>检索（${esc(ev.retrieve.source)}，上下文 ${esc(ev.retrieve.context_tokens)} token / 预算 ${esc(ev.retrieve.budget_tokens)}）</h4><pre>${esc(cs||'无')}</pre></div>`;
  }
  if(ev.evidence){
    const e=ev.evidence;
    h+=`<div class="kv"><h4>证据主题匹配（${Math.round(e.coverage*100)}%，门槛 ${Math.round(e.min_coverage*100)}%）</h4><pre>命中：${esc((e.covered||[]).join('、')||'无')}\n缺失：${esc((e.missing||[]).join('、')||'无')}\n作为工程范围忽略：${esc((e.ignored_scope||[]).join('、')||'无')}\n词面命中仅用于排除明显无关内容，不代表证据完整。</pre></div>`;
  }
  if(ev.prompt) h+=`<div class="kv"><h4>发给大模型的协议（system ${esc(ev.prompt.system_tokens)} / user ${esc(ev.prompt.user_tokens)} token）</h4>
    <details><summary style="cursor:pointer;color:var(--brand);font-size:12px">展开 system</summary><pre>${esc(ev.prompt.system)}</pre></details>
    <details open><summary style="cursor:pointer;color:var(--brand);font-size:12px">展开 user（组装内容）</summary><pre>${esc(ev.prompt.user)}</pre></details></div>`;
  if(ev.llm) h+=`<div class="kv"><h4>大模型返回（${ev.llm.ok?'成功':'失败'}，finish=${esc(ev.llm.finish_reason||'-')}，${esc(ev.llm.elapsed_ms)}ms，${esc(JSON.stringify(ev.llm.usage||{}))}）</h4><pre>${esc((ev.llm.content||'').slice(0,4000))}</pre></div>`;
  h+=`<div class="kv"><h4>操作过程</h4><div id="evtlist"></div></div>`;
  h+=`<div class="kv"><h4>评估结果</h4><div id="evalBox"><div class="hint">点右上「评估当前」生成</div></div></div>`;
  body.innerHTML=h;
  const el=body.querySelector("#evtlist");
  (t.events||[]).forEach(e=>{
    const d=document.createElement("div"); d.className="evt";
    let brief=JSON.stringify(e.data); if(brief.length>160) brief=brief.slice(0,160)+"…";
    d.innerHTML=`<div><span class="st">${e.seq}. ${esc(e.stage)}</span><span class="tm">${fmtTime(e.ts)}</span></div>
      <div style="color:#5b6472;font-size:11.5px;margin-top:2px">${esc(brief)}</div>`;
    el.appendChild(d);
  });
  if((t.audits||[]).length){ renderAudit(t.audits[t.audits.length-1].report); }
  body.scrollTop=0;
}
function renderAudit(r){
  const box=$("#evalBox"); if(!box) return;
  if(!r){ box.innerHTML='<div class="hint">无评估</div>'; return; }
  const v=r.verdict||'fair'; const sc=r.score!=null?Math.round(r.score):'';
  let h=`<div style="margin-bottom:8px"><span class="tag ${v}">${v}</span> 评分 <b>${esc(sc)}</b></div>`;
  const checks=(r.rule&&r.rule.checks)||[];
  if(checks.length){
    h+='<div style="margin-bottom:6px"><b>规则检查</b></div>';
    checks.forEach(c=>{ h+=`<div style="margin:2px 0"><span class="tag ${c.ok?'ok':'bad'}">${c.ok?'OK':'问题'}</span>${esc(c.name)}：${esc(c.detail)}</div>`; });
  }
  if(r.weight_only_insufficient){
    h+=`<div style="margin-top:8px;padding:8px;background:#fff6e5;border:1px solid #ffe0a3;border-radius:8px">
      <b>⚠ 仅调权重无效</b><div style="font-size:12px;color:#7a5200;margin-top:3px">${esc(r.root_cause_hint||'')}</div></div>`;
  }
  if(r.llm&&!r.llm.error){
    h+=`<div style="margin-top:8px"><b>模型评审</b>（忠实=${r.llm.faithful?'是':'否'}，相关=${r.llm.relevant?'是':'否'}，完整=${r.llm.complete?'是':'否'}，跑题=${r.llm.off_topic?'是':'否'}）</div>`;
    const dims=[["忠实度",r.llm.faithful],["相关性",r.llm.relevant],["完整性",r.llm.complete]];
    const weak=dims.filter(d=>d[1]===false).map(d=>d[0]).join("、");
    if(weak) h+=`<div style="color:#c0392b;margin-top:6px;font-size:12px">薄弱项：${esc(weak)}</div>`;
    (r.llm.reasons||[]).forEach(x=>{ h+=`<div style="color:#5b6472;margin:2px 0">· ${esc(x)}</div>`; });
  }
  const imps=r.improvements||[];
  const acts=r.improvement_actions||[];
  if(acts.length){
    h+='<div style="margin-top:8px"><b>改进分流（按可解决方式）</b></div>';
    const label={boost:"可调整召回排序",ingest:"需补召回/扩库",config:"需改门槛/检索/提示词"};
    acts.forEach(a=>{ h+=`<div style="margin:3px 0;font-size:12px"><span class="tag ${a.kind==='boost'?'ok':(a.kind==='ingest'?'bad':'fair')}">${esc(label[a.kind]||a.kind)}</span>${esc(a.improvement)}</div>`; });
  } else if(imps.length){
    h+='<div style="margin-top:8px"><b>harness 可提升点</b></div><ul class="impr">'+imps.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
  }
  if(r.learned_boosts&&r.learned_boosts.length){
    h+='<div style="margin-top:8px"><span class="tag ok">已沉淀为召回提示</span> 下次检索会对这些文件/符号加权：<br>'
      + r.learned_boosts.map(x=>`<code>${esc(x.kind)}:${esc(x.pattern)}</code>`).join('、') + '</div>';
  }
  box.innerHTML=h;
}
$("#traceBtn").onclick=openDrawer;
$("#drawerClose").onclick=()=>$("#drawer").classList.remove("open");
$("#evalBtn").onclick=async ()=>{
  if(!window._curTrace){ alert("先选择一条调用记录"); return; }
  const box=$("#evalBox"); if(box) box.innerHTML='<div class="hint">评估中…（会调用一次模型做评审）</div>';
  try{
    const r=await api("/api/traces/"+window._curTrace+"/evaluate?learn=true",{method:"POST"});
    renderAudit(r);
    if(window._curTrace){
      const qs=await api("/api/boosts"+(state.libId?("?workspace="+encodeURIComponent(state.libId)):""));
      if(qs.boosts&&qs.boosts.length){
        const box2=$("#evalBox");
        box2.insertAdjacentHTML("beforeend",
          `<div style="margin-top:10px"><b>当前库召回提示（${qs.boosts.length}）</b><div>`
          + qs.boosts.map(x=>`<span class="tag fair" title="${esc(x.source)}" data-kind="${esc(x.kind)}" data-pattern="${esc(x.pattern)}">${esc(x.kind)}:${esc(x.pattern)} <b>×${x.weight.toFixed(1)}</b></span>`).join(" ")
          + `</div></div>`);
      }
    }
  }
  catch(e){ if(box) box.innerHTML='<div class="hint">评估失败：'+esc(e.message)+'</div>'; }
};

init();
</script>
